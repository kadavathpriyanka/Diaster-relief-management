services:

  mysql:
    image: mysql:8.0
    container_name: disaster-relief-mysql
    environment:
      MYSQL_DATABASE: disaster_relief
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: disaster-relief-backend
    environment:
      DB_USERNAME: root
      DB_PASSWORD: 1234
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: disaster-relief-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
